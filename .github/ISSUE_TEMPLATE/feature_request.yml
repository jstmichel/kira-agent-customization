name: Feature request
description: Propose a new agent behavior, workflow, or repo capability.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer pain should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior, files, and workflows.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Note token budget, compatibility, install, or maintenance concerns.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should we know this request is complete?
